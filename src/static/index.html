<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generador de overlay · Twitch / Kick</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">
  <div>
    <h1>Generador de overlay</h1>
    <p class="lead">Vertical 1080×1920, WebM con canal alfa, listo para Filmora.</p>

    <div class="panel">
      <div class="platform tw" id="pTw" data-on="1">
        <div class="prow">
          <span class="chip tw">T</span>
          <span class="pname">Twitch</span>
          <span class="sw"><input type="checkbox" id="onTw" checked><span class="track"></span><span class="knob"></span></span>
        </div>
        <div class="field"><span class="pre">twitch.tv/</span><input type="text" id="nameTw" placeholder="tu_usuario" spellcheck="false"></div>
      </div>

      <div class="platform kk" id="pKk" data-on="1">
        <div class="prow">
          <span class="chip kk">K</span>
          <span class="pname">Kick</span>
          <span class="sw"><input type="checkbox" id="onKk" checked><span class="track"></span><span class="knob"></span></span>
        </div>
        <div class="field"><span class="pre">kick.com/</span><input type="text" id="nameKk" placeholder="se copia del de Twitch" spellcheck="false"></div>
      </div>

      <label class="small" for="label">Texto de arriba</label>
      <div class="field"><input type="text" id="label" value="sígueme en vivo" maxlength="40"></div>

      <label class="small" for="animation">Animación de entrada</label>
      <div class="field"><select id="animation">
        <option value="barrido" selected>Barrido lateral</option>
        <option value="deslizar">Sube desde abajo</option>
        <option value="rebote">Sube con rebote</option>
        <option value="escala">Crece desde el centro</option>
        <option value="cortina">Se abre como cortina</option>
        <option value="desvanecer">Aparece suave</option>
      </select></div>

      <div class="grid2">
        <div>
          <label class="small" for="position">Altura</label>
          <div class="field"><select id="position">
            <option value="alta">Alta</option>
            <option value="media" selected>Media</option>
            <option value="baja">Baja</option>
          </select></div>
        </div>
        <div>
          <label class="small" for="align">Alineación</label>
          <div class="field"><select id="align">
            <option value="izquierda">Izquierda</option>
            <option value="centro" selected>Centro</option>
            <option value="derecha">Derecha</option>
          </select></div>
        </div>
      </div>

      <label class="small" for="duration">Duración (s)</label>
      <div class="field"><input type="number" id="duration" value="6" min="2" max="30" step="1"></div>

      <button class="go" id="go">Generar WebM</button>
      <div class="warn" id="warn"></div>
      <div class="status" id="status"></div>
      <a class="dl" id="dl" style="display:none" download>Descargar archivo</a>
    </div>
  </div>

  <div>
    <div class="panel">
      <div class="stage">
        <div class="bg checker" id="bg"></div>
        <img id="prev" alt="vista previa">
        <video id="vid" style="display:none" autoplay loop muted playsinline></video>
      </div>
      <div class="bgpick">
        <button data-bg="checker" aria-pressed="true">Cuadros</button>
        <button data-bg="dark" aria-pressed="false">Fondo oscuro</button>
        <button data-bg="light" aria-pressed="false">Fondo claro</button>
      </div>
      <p class="hint">La vista previa repite la entrada en bucle. Si no se mueve, tu navegador no soporta SMIL; el video sí saldrá animado.</p>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
