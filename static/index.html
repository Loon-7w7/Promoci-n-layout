<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generador de overlay · Twitch / Kick</title>
<style>
  @font-face { font-family: Poppins; src: url("/fonts/Poppins-Light.ttf"); font-weight: 300; }
  @font-face { font-family: Poppins; src: url("/fonts/Poppins-Medium.ttf"); font-weight: 500; }
  @font-face { font-family: Poppins; src: url("/fonts/Poppins-Bold.ttf"); font-weight: 700; }

  :root {
    --violet: #7C3AED;
    --violet-soft: #A78BFA;
    --green: #53FC18;
    --ink: #0d0b16;
    --panel: #171327;
    --line: #2b2440;
    --text: #ECE9F5;
    --muted: #9b93b5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 32px;
    font-family: Poppins, system-ui, sans-serif; font-weight: 300;
    color: var(--text);
    background:
      radial-gradient(900px 600px at 12% -10%, #2a1a52 0%, transparent 60%),
      radial-gradient(700px 500px at 105% 110%, #10320a 0%, transparent 55%),
      var(--ink);
  }
  h1 { font-weight: 700; font-size: 26px; margin: 0 0 4px; letter-spacing: -.2px; }
  .lead { color: var(--muted); margin: 0 0 26px; font-size: 15px; }
  .wrap { display: grid; grid-template-columns: minmax(340px, 460px) 1fr; gap: 32px; max-width: 1180px; margin: 0 auto; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 22px; }
  .panel + .panel { margin-top: 18px; }

  .platform { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; transition: border-color .15s, background .15s; }
  .platform[data-on="1"].tw { border-color: color-mix(in srgb, var(--violet) 70%, transparent); background: color-mix(in srgb, var(--violet) 10%, transparent); }
  .platform[data-on="1"].kk { border-color: color-mix(in srgb, var(--green) 55%, transparent); background: color-mix(in srgb, var(--green) 7%, transparent); }
  .prow { display: flex; align-items: center; gap: 12px; }
  .pname { font-weight: 500; font-size: 15px; flex: 1; }
  .chip { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-weight: 700; font-size: 15px; }
  .chip.tw { background: #fff; color: var(--violet); }
  .chip.kk { background: var(--green); color: #07070A; }

  /* interruptor */
  .sw { position: relative; width: 46px; height: 26px; flex: none; }
  .sw input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .track { position: absolute; inset: 0; background: #35304a; border-radius: 999px; transition: background .18s; pointer-events: none; }
  .knob { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .18s; pointer-events: none; }
  .sw input:checked ~ .track { background: var(--violet); }
  .kk .sw input:checked ~ .track { background: var(--green); }
  .sw input:checked ~ .knob { transform: translateX(20px); }
  .sw input:focus-visible ~ .track { outline: 2px solid var(--violet-soft); outline-offset: 2px; }

  .field { margin-top: 12px; display: flex; align-items: center; gap: 0; border: 1px solid var(--line); border-radius: 10px; background: #0f0d1a; overflow: hidden; }
  .field .pre { padding: 0 2px 0 12px; color: var(--muted); font-size: 14px; white-space: nowrap; }
  input[type=text], input[type=number], select {
    flex: 1; width: 100%; background: transparent; border: 0; color: var(--text);
    font-family: inherit; font-weight: 500; font-size: 15px; padding: 11px 12px; outline: none;
  }
  select { appearance: none; cursor: pointer; }
  select option { background: #171327; }
  .field:focus-within { border-color: var(--violet-soft); }
  .platform[data-on="0"] .field { opacity: .4; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  label.small { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }

  button.go {
    width: 100%; margin-top: 18px; padding: 14px 18px; border: 0; border-radius: 12px; cursor: pointer;
    font-family: inherit; font-weight: 700; font-size: 16px; color: #14061f;
    background: linear-gradient(100deg, var(--violet-soft), var(--green));
  }
  button.go:disabled { opacity: .35; cursor: not-allowed; }
  .warn { margin-top: 10px; font-size: 13px; color: #ffb4b4; min-height: 18px; }
  .status { margin-top: 10px; font-size: 13px; color: var(--muted); min-height: 18px; }

  /* vista previa */
  .stage { position: relative; width: 100%; max-width: 330px; aspect-ratio: 9/16; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); margin: 0 auto; }
  .stage .bg { position: absolute; inset: 0; }
  .bg.checker {
    background-color: #6d6482;
    background-image: linear-gradient(45deg, #4b4460 25%, transparent 25%), linear-gradient(-45deg, #4b4460 25%, transparent 25%),
                      linear-gradient(45deg, transparent 75%, #4b4460 75%), linear-gradient(-45deg, transparent 75%, #4b4460 75%);
    background-size: 36px 36px; background-position: 0 0, 0 18px, 18px -18px, -18px 0;
  }
  .bg.light { background: #e9e4d8; }
  .bg.dark { background: #10131a; }
  .stage img, .stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .bgpick { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
  .bgpick button { border: 1px solid var(--line); background: #0f0d1a; color: var(--muted); font-family: inherit; font-size: 12px; padding: 6px 12px; border-radius: 999px; cursor: pointer; }
  .bgpick button[aria-pressed=true] { color: var(--text); border-color: var(--violet-soft); }
  .hint { text-align: center; color: var(--muted); font-size: 12px; margin-top: 10px; }
  a.dl { display: inline-block; margin-top: 12px; color: var(--green); font-weight: 500; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>Generador de overlay</h1>
    <p class="lead">Vertical 1080×1920, WebM con canal alfa, listo para Filmora.</p>

    <div class="panel">
      <div class="platform tw" id="pTw" data-on="1">
        <div class="prow">
          <span class="chip tw">T</span>
          <span class="pname">Twitch</span>
          <span class="sw"><input type="checkbox" id="onTw" checked><span class="track"></span><span class="knob"></span></span>
        </div>
        <div class="field"><span class="pre">twitch.tv/</span><input type="text" id="nameTw" placeholder="tu_usuario" spellcheck="false"></div>
      </div>

      <div class="platform kk" id="pKk" data-on="1">
        <div class="prow">
          <span class="chip kk">K</span>
          <span class="pname">Kick</span>
          <span class="sw"><input type="checkbox" id="onKk" checked><span class="track"></span><span class="knob"></span></span>
        </div>
        <div class="field"><span class="pre">kick.com/</span><input type="text" id="nameKk" placeholder="se copia del de Twitch" spellcheck="false"></div>
      </div>

      <label class="small" for="label">Texto de arriba</label>
      <div class="field"><input type="text" id="label" value="sígueme en vivo" maxlength="40"></div>

      <div class="grid2">
        <div>
          <label class="small" for="position">Posición</label>
          <div class="field"><select id="position">
            <option value="alta">Alta</option>
            <option value="media" selected>Media</option>
            <option value="baja">Baja</option>
          </select></div>
        </div>
        <div>
          <label class="small" for="duration">Duración (s)</label>
          <div class="field"><input type="number" id="duration" value="6" min="2" max="30" step="1"></div>
        </div>
      </div>

      <button class="go" id="go">Generar WebM</button>
      <div class="warn" id="warn"></div>
      <div class="status" id="status"></div>
      <a class="dl" id="dl" style="display:none" download>Descargar archivo</a>
    </div>
  </div>

  <div>
    <div class="panel">
      <div class="stage">
        <div class="bg checker" id="bg"></div>
        <img id="prev" alt="vista previa">
        <video id="vid" style="display:none" autoplay loop muted playsinline></video>
      </div>
      <div class="bgpick">
        <button data-bg="checker" aria-pressed="true">Cuadros</button>
        <button data-bg="dark" aria-pressed="false">Fondo oscuro</button>
        <button data-bg="light" aria-pressed="false">Fondo claro</button>
      </div>
      <p class="hint">La vista previa muestra el fotograma final. El video incluye la entrada animada.</p>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const onTw = $('onTw'), onKk = $('onKk'), nameTw = $('nameTw'), nameKk = $('nameKk');
let kickTocado = false; // mientras no lo edites a mano, copia el nombre de Twitch

function estado() {
  return {
    twitch: onTw.checked ? nameTw.value.trim() : null,
    kick:   onKk.checked ? nameKk.value.trim() : null,
    label:  $('label').value,
    position: $('position').value,
    duration: parseFloat($('duration').value) || 6,
    fps: 30
  };
}

function validar(s) {
  if (!onTw.checked && !onKk.checked) return 'Activa al menos una plataforma.';
  if (onTw.checked && !s.twitch) return 'Falta el nombre de Twitch.';
  if (onKk.checked && !s.kick) return 'Falta el nombre de Kick.';
  return '';
}

let tPrev;
function refrescar() {
  $('pTw').dataset.on = onTw.checked ? '1' : '0';
  $('pKk').dataset.on = onKk.checked ? '1' : '0';
  nameTw.disabled = !onTw.checked;
  nameKk.disabled = !onKk.checked;

  const s = estado();
  const err = validar(s);
  $('warn').textContent = err;
  $('go').disabled = !!err;
  if (err) {
    $('prev').removeAttribute('src');
    $('prev').style.display = 'none';
    return;
  }

  clearTimeout(tPrev);
  tPrev = setTimeout(() => {
    const q = new URLSearchParams();
    if (s.twitch) q.set('twitch', s.twitch);
    if (s.kick) q.set('kick', s.kick);
    q.set('label', s.label);
    q.set('position', s.position);
    $('prev').src = '/preview.svg?' + q.toString();
    $('prev').style.display = '';
    $('vid').style.display = 'none';
  }, 220);
}

// si Kick no se ha tocado a mano, copia el nombre de Twitch
nameTw.addEventListener('input', () => {
  if (!kickTocado) nameKk.value = nameTw.value;
  refrescar();
});
nameKk.addEventListener('input', () => { kickTocado = nameKk.value.trim() !== ''; refrescar(); });
['onTw','onKk','label','position','duration'].forEach(id => {
  $(id).addEventListener('input', refrescar);
  $(id).addEventListener('change', refrescar);
});

document.querySelectorAll('.bgpick button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.bgpick button').forEach(x => x.setAttribute('aria-pressed', 'false'));
    b.setAttribute('aria-pressed', 'true');
    $('bg').className = 'bg ' + b.dataset.bg;
  });
});

$('go').addEventListener('click', async () => {
  const s = estado();
  const err = validar(s);
  if (err) { $('warn').textContent = err; return; }

  const btn = $('go');
  btn.disabled = true;
  $('dl').style.display = 'none';
  const t0 = Date.now();
  const tick = setInterval(() => {
    $('status').textContent = 'Renderizando fotogramas… ' + ((Date.now() - t0) / 1000).toFixed(0) + ' s';
  }, 500);

  try {
    const r = await fetch('/render', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(s)
    });
    if (!r.ok) {
      const d = await r.json().catch(() => ({ detail: 'Error desconocido' }));
      throw new Error(d.detail || r.statusText);
    }
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const v = $('vid');
    v.src = url; v.style.display = ''; $('prev').style.display = 'none';
    const dl = $('dl');
    dl.href = url;
    dl.download = 'overlay-' + ((s.twitch || s.kick).toLowerCase().replace(/[^a-z0-9._-]+/g, '-')) + '.webm';
    dl.style.display = 'inline-block';
    $('status').textContent = 'Listo · ' + (blob.size / 1024).toFixed(0) + ' KB · ' +
                              ((Date.now() - t0) / 1000).toFixed(1) + ' s';
  } catch (e) {
    $('status').textContent = 'Error: ' + e.message;
  } finally {
    clearInterval(tick);
    btn.disabled = false;
  }
});

refrescar();
</script>
</body>
</html>
